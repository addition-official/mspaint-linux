name: Release

# Builds every package (.deb, .rpm, AppImage, .tar.gz, plus SHA256SUMS) and publishes
# them as a new GitHub release named after the version in Cargo.toml. Run it on main
# from the Actions tab (Run workflow), or push a tag like v0.3.1. It never replaces the
# files of a release that already exists: bump the version first.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Built on an older base (glibc 2.35) so the packages also run on older
    # distributions, e.g. Ubuntu 22.04 and Debian 12.
    container: ubuntu:22.04
    steps:
      - name: Build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config dpkg-dev file fonts-noto-core
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
      # No build cache: release packages are built from scratch.
      - run: cargo test
      - name: Packaging tools
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.1 --locked
      - run: ./packaging/build-all.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          notes="- **Debian, Ubuntu, Linux Mint, Pop!_OS:** download the .deb, then \`sudo apt install ./paintbox_${version}-1_amd64.deb\`
          - **Fedora, openSUSE:** download the .rpm, then \`sudo dnf install ./paintbox-${version}-1.x86_64.rpm\` (openSUSE: \`sudo zypper install\`)
          - **Any distribution:** download the .AppImage, make it executable (\`chmod +x\`) and run it.
          - **Or:** unpack the .tar.gz and run \`./install.sh\`.
          - **Check a download:** \`sha256sum -c SHA256SUMS --ignore-missing\` in the download folder."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version in Cargo.toml to make a new one." >&2
            exit 1
          fi
          gh release create "$tag" dist/* --title "Paintbox $version" --notes "$notes" --target "$GITHUB_SHA"
