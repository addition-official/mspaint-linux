name: Release

# Builds the .deb and publishes it as a GitHub release named after the version in
# Cargo.toml. Run it from the Actions tab (Run workflow), or push a tag like v0.3.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Fonts for the text tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: cargo test
      - name: Build .deb
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          deb=$(ls target/debian/*.deb)
          notes="Install on Kubuntu 24.04 or newer: download $(basename "$deb"), then run
          \`sudo apt install ./$(basename "$deb")\` in the folder you downloaded it to."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" --clobber
          else
            gh release create "$tag" "$deb" --title "Paint $version" --notes "$notes" --target "$GITHUB_SHA"
          fi
