name: Apt repository

# Publishes Paintbox's apt repository on GitHub Pages with the .deb of the latest
# release, so people can `sudo apt install paintbox` and get updates with `apt upgrade`.
# Runs after each Release run, or by hand from the Actions tab.
#
# One-time setup:
#   - Settings > Secrets and variables > Actions: a secret APT_GPG_PRIVATE_KEY with the
#     ASCII-armored private key that signs the repository (no passphrase).
#   - Settings > Pages > Source: GitHub Actions.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
      - name: Download the latest release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
      - name: Signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The APT_GPG_PRIVATE_KEY secret is missing (see the top of this file)." >&2
            exit 1
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build the repository
        run: |
          # The .deb adds packaging/apt/paintbox.sources: its key must be the signing key,
          # or every installed copy would refuse the repository.
          shipped=$(sed -n '/BEGIN PGP/,/END PGP/{s/^ //;s/^\.$//;p}' packaging/apt/paintbox.sources | gpg --show-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          if [ "$shipped" != "$KEY_ID" ]; then
            echo "packaging/apt/paintbox.sources has key $shipped, but the signing key is $KEY_ID." >&2
            exit 1
          fi
          ./packaging/apt-repo.sh debs site/apt "$KEY_ID"
          cp packaging/apt/paintbox.sources site/apt/
          # The site's front page points to the project.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=https://github.com/%s"><title>Paintbox</title>\n' "$GITHUB_REPOSITORY" > site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
