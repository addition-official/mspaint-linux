name: CI

on:
  push:
  pull_request:

# The workflow only reads the code and uploads the .deb as an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Pinned so a new Rust release (with new lints) can't suddenly fail CI.
      # Bump deliberately after checking `cargo clippy` with the new version.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Fonts for the text tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Flatpak crate list matches Cargo.lock
        run: |
          python3 packaging/flatpak/cargo-sources.py
          git diff --exit-code packaging/flatpak/cargo-sources.json || { echo "Run python3 packaging/flatpak/cargo-sources.py and commit the result."; exit 1; }
      - name: Build .deb
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paintbox-deb
          path: target/debian/*.deb
