name: CI

on:
  push:
  pull_request:

# The workflow only reads the code and uploads the .deb as an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pinned so a new Rust release (with new lints) can't suddenly fail CI.
      # Bump deliberately after checking `cargo clippy` with the new version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fonts for the text tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Build .deb
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: mspaint-linux-deb
          path: target/debian/*.deb
