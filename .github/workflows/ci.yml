name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fonts for the text tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: mspaint-linux-deb
          path: target/debian/*.deb
