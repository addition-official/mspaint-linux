# Flatpak build of Paintbox. This copy builds the checkout it sits in (CI uses it to
# make a test bundle); the Flathub copy is the same with a git source for a release tag.
#
#   flatpak-builder --user --install --force-clean build packaging/flatpak/io.github.addition_official.Paintbox.yml
#
# After Cargo.lock changes, run: python3 packaging/flatpak/cargo-sources.py
id: io.github.addition_official.Paintbox
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: paintbox
finish-args:
  # Wayland, or X11 where there is no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL.
  - --device=dri
  # Files are opened and saved through the portal's file dialogs, which grant access
  # to the chosen file only. Printing, the wallpaper and the light/dark setting also
  # go through portals.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/paintbox/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: paintbox
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/paintbox /app/bin/paintbox
      - install -Dm644 assets/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 assets/${FLATPAK_ID}.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 assets/${FLATPAK_ID}.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 assets/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - build
          - .flatpak-builder
      - cargo-sources.json
