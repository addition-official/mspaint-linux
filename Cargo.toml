[package]
name = "mspaint-linux"
version = "0.3.1"
edition = "2024"
description = "A Windows 11 Paint style image editor for Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/addition-official/mspaint-linux"
keywords = ["paint", "image-editor", "drawing", "mspaint", "linux"]
categories = ["graphics", "multimedia::images"]

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.36"
fontdb = "0.24.0"
# Only the formats Paint opens or saves: fewer decoders reachable from untrusted files.
image = { version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "bmp", "gif", "tiff", "webp", "ico", "tga", "pnm", "qoi"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds responsive: pixel work in dependencies is slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.deb]
maintainer = "mspaint-linux contributors"
section = "graphics"
priority = "optional"
extended-description = """\
A clone of Windows 11 Paint for Linux. \
Pencil, brushes, shapes, text, fill, color picker, selections, crop, \
resize/skew, rotate/flip, zoom, rulers, gridlines and light/dark themes."""
# $auto works out the minimum libc from the binary (built on an older base, so it runs
# on older releases too); the rest are loaded at run time and can't be detected.
depends = "$auto, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libxcursor1, libxrandr2, libxi6"
recommends = "xdg-desktop-portal-kde | xdg-desktop-portal-gnome | xdg-desktop-portal-gtk"
assets = [
    ["target/release/mspaint-linux", "usr/bin/", "755"],
    ["assets/mspaint-linux.desktop", "usr/share/applications/", "644"],
    ["assets/mspaint-linux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/mspaint-linux/README.md", "644"],
]

# Fedora / openSUSE package (cargo generate-rpm).
[package.metadata.generate-rpm]
summary = "Windows 11 Paint style image editor"
assets = [
    { source = "target/release/mspaint-linux", dest = "/usr/bin/mspaint-linux", mode = "755" },
    { source = "assets/mspaint-linux.desktop", dest = "/usr/share/applications/mspaint-linux.desktop", mode = "644" },
    { source = "assets/mspaint-linux.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mspaint-linux.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mspaint-linux/README.md", mode = "644", doc = true },
]
