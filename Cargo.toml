[package]
name = "mspaint-linux"
version = "0.1.0"
edition = "2024"
description = "A Windows 11 Paint style image editor for Linux and KDE Plasma (Kubuntu)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/addition-official/mspaint-linux"
keywords = ["paint", "image-editor", "drawing", "kde", "linux"]
categories = ["graphics", "multimedia::images"]

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.36"
fontdb = "0.24.0"
image = "0.25.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds responsive: pixel work in dependencies is slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[package.metadata.deb]
maintainer = "mspaint-linux contributors"
section = "graphics"
priority = "optional"
extended-description = """\
A clone of Windows 11 Paint for Linux, tuned for KDE Plasma / Kubuntu. \
Pencil, brushes, shapes, text, fill, colour picker, selections, crop, \
resize/skew, rotate/flip, zoom, rulers, gridlines and light/dark themes."""
depends = "libc6 (>= 2.39), libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libxcursor1, libxrandr2, libxi6"
recommends = "xdg-desktop-portal-kde"
assets = [
    ["target/release/mspaint-linux", "usr/bin/", "755"],
    ["assets/mspaint-linux.desktop", "usr/share/applications/", "644"],
    ["assets/mspaint-linux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/mspaint-linux/README.md", "644"],
]
